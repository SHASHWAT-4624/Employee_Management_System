
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Employee | EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f1f5f9; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: #172554; }
        .form-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">EMS Portal</a>
    </div>
</nav>

<div class="container">

    <div class="form-container">

        <h2 class="text-center fw-bold text-primary mb-3">
            Update Employee
        </h2>

        <p class="text-secondary text-center">
            Search for an employee using their Employee ID.
        </p>

        <!-- Search Form -->
        <form th:action="@{/findEmployee}" method="get">

            <label class="form-label fw-semibold">Employee ID</label>

            <div class="input-group">
                <input type="number" name="id" min="1"
                       class="form-control"
                       placeholder="Enter Employee ID" required>

                <button type="submit" class="btn btn-primary">
                    Find Employee
                </button>
            </div>

        </form>

        <div th:if="${error}" class="alert alert-danger mt-3"
             th:text="${error}"></div>

        <hr class="my-4">

        <!-- Update Form -->
        <div th:if="${employeeFound}">

            <h5 class="fw-bold mb-3">Employee Details</h5>

            <form th:action="@{/updateEmployee}"
                  th:object="${employee}" method="post">

                <input type="hidden" th:field="*{employee_id}">
                <input type="hidden" th:field="*{salary}">
                <input type="hidden" th:field="*{designation}">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Employee ID</label>
                        <input type="text" th:value="*{employee_id}"
                               class="form-control" readonly>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Employee Name</label>
                        <input type="text" th:field="*{employee_name}"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Age</label>
                        <input type="number" th:field="*{age}"
                               class="form-control" min="18" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Branch</label>
                        <input type="text" th:field="*{branch}"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Gender</label>
                        <select th:field="*{gender}" class="form-select" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                </div>

                <div class="d-flex justify-content-center gap-3 mt-3">

                    <button type="submit" class="btn btn-success px-4">
                        Update Employee
                    </button>

                    <a th:href="@{/service}" class="btn btn-secondary px-4">
                        Back to Services
                    </a>

                </div>

            </form>

        </div>

        <div class="text-center mt-4" th:unless="${employeeFound}">
            <a th:href="@{/service}" class="btn btn-secondary">
                Back to Services
            </a>
        </div>

    </div>

</div>

</body>
</html>
