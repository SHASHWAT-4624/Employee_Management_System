
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Records | EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f1f5f9; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: #172554; }
        .table-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-top: 40px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }
        .table th { background: #172554; color: white; white-space: nowrap; }
        .table td { vertical-align: middle; }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">EMS Portal</a>
    </div>
</nav>

<div class="container">

    <div class="mt-5">
        <h2 class="fw-bold">Employee Records</h2>
        <p class="text-secondary">All registered employees in the database.</p>
    </div>

    <div class="table-container">
        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Branch</th>
                        <th>Email</th>
                        <th>Salary</th>
                        <th>Designation</th>
                        <th>Gender</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="emp : ${employees}">
                        <td th:text="${emp.employee_id}"></td>
                        <td th:text="${emp.employee_name}"></td>
                        <td th:text="${emp.age}"></td>
                        <td th:text="${emp.branch}"></td>
                        <td th:text="${emp.email}"></td>
                        <td th:text="${emp.salary}"></td>
                        <td th:text="${emp.designation}"></td>
                        <td th:text="${emp.gender}"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(employees)}">
                        <td colspan="8" class="text-center text-secondary py-4">
                            No employee records found.
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/service}" class="btn btn-secondary px-4">
            Back to Services
        </a>
    </div>

</div>

</body>
</html>
