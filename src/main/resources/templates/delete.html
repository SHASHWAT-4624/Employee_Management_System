
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Employee | EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f1f5f9; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: #172554; }
        .form-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">EMS Portal</a>
    </div>
</nav>

<div class="container">

    <div class="form-container">

        <h2 class="text-center fw-bold text-danger mb-3">
            Delete Employee
        </h2>

        <p class="text-secondary text-center">
            Enter an Employee ID to find the record you want to delete.
        </p>

        <!-- Search Form -->
        <form th:action="@{/findEmployeeToDelete}" method="get">

            <label class="form-label fw-semibold">Employee ID</label>

            <div class="input-group">
                <input type="number" name="id" min="1"
                       class="form-control"
                       placeholder="Enter Employee ID" required>

                <button type="submit" class="btn btn-primary">
                    Find Employee
                </button>
            </div>

        </form>

        <div th:if="${error}" class="alert alert-danger mt-3"
             th:text="${error}"></div>

        <!-- Employee Details -->
        <div th:if="${employeeFound}" class="mt-4">

            <div class="alert alert-warning">
                Please verify this employee before deleting the record.
            </div>

            <table class="table table-bordered">
                <tr>
                    <th>Employee ID</th>
                    <td th:text="${employee.employee_id}"></td>
                </tr>
                <tr>
                    <th>Name</th>
                    <td th:text="${employee.employee_name}"></td>
                </tr>
                <tr>
                    <th>Age</th>
                    <td th:text="${employee.age}"></td>
                </tr>
                <tr>
                    <th>Branch</th>
                    <td th:text="${employee.branch}"></td>
                </tr>
                <tr>
                    <th>Email</th>
                    <td th:text="${employee.email}"></td>
                </tr>
                <tr>
                    <th>Gender</th>
                    <td th:text="${employee.gender}"></td>
                </tr>
            </table>

            <form th:action="@{/deleteEmployee}" method="post"
                  class="d-flex justify-content-center gap-3">

                <input type="hidden" name="id"
                       th:value="${employee.employee_id}">

                <button type="submit" class="btn btn-danger px-4"
                        onclick="return confirm('Are you sure you want to delete this employee?')">
                    Confirm Delete
                </button>

                <a th:href="@{/service}" class="btn btn-secondary px-4">
                    Back to Services
                </a>

            </form>

        </div>

        <div class="text-center mt-4" th:unless="${employeeFound}">
            <a th:href="@{/service}" class="btn btn-secondary">
                Back to Services
            </a>
        </div>

    </div>

</div>

</body>
</html>
